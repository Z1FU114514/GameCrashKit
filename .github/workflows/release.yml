name: Release Portable Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_label:
        description: 'Release version label (e.g. v0.1.0-alpha.1 or v0.1.0)'
        required: true
        default: 'v0.2.0-alpha.2'

permissions:
  contents: write

jobs:
  publish-portable:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version label
        id: meta
        shell: pwsh
        run: |
          $label = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version_label }}" } else { "${{ github.ref_name }}" }
          $isPre = ($label -match "-(alpha|beta|rc)")
          "version_label=$label" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "is_prerelease=$($isPre.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build, test, and publish portable win-x64 ZIP
        shell: pwsh
        run: pwsh -File scripts/Publish-Portable.ps1 -VersionLabel "${{ steps.meta.outputs.version_label }}"

      - name: Run automated release-gate verification
        shell: pwsh
        run: pwsh -File scripts/Verify-ReleaseGate.ps1 -PortableDir "publish/GameCrashKit-${{ steps.meta.outputs.version_label }}-win-x64" -BenchmarkRuns 20

      - name: Upload portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GameCrashKit-${{ steps.meta.outputs.version_label }}-win-x64
          path: |
            publish/*.zip
            publish/*.SHA256SUMS.txt

      - name: Create GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.meta.outputs.is_prerelease }}
          generate_release_notes: true
          files: |
            publish/*.zip
            publish/*.SHA256SUMS.txt
