name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore GameCrashKit.sln

      - name: Build Release (TreatWarningsAsErrors)
        run: dotnet build GameCrashKit.sln -c Release --no-restore

      - name: Run unit, Windows, and WPF layout/PNG tests
        run: dotnet test GameCrashKit.sln -c Release --no-build --verbosity normal

      - name: Verify architecture and manifest security boundaries
        shell: pwsh
        run: |
          $coreProj = Get-Content "src/GameCrashKit.Core/GameCrashKit.Core.csproj" -Raw
          if ($coreProj -match "UseWPF|EventLog|Management|PackageReference") {
            throw "Core layer dependency boundary violated!"
          }
          $manifest = Get-Content "src/GameCrashKit.App/app.manifest" -Raw
          if ($manifest -notmatch 'level="asInvoker"') {
            throw "app.manifest must lock requestedExecutionLevel to asInvoker!"
          }
          Write-Host "Architecture & manifest security boundaries verified."
